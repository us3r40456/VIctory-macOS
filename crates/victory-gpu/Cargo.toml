[package]
name = "victory-gpu"
description = "D3D12.X command streams and GPU memory, translated onto host D3D12."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
miniz_oxide.workspace = true
tracing.workspace = true
anyhow.workspace = true
victory-formats.workspace = true
victory-shader = { workspace = true, features = ["host"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
# Itself, with what its own tests of the frame recorder need
# (`tests/replay.rs` runs a made-up frame through the host layer).
victory-gpu = { path = ".", features = ["replay-testing"] }

[features]
# Debugging switches (frame capture, the host debug layer, per-draw data).
diagnostics = []
# A made-up frame run through the host layer, for the tests of the frame
# recorder (`replay::testing`). Not in any build of the runtime.
replay-testing = []

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
rayon.workspace = true
victory-pipeline.workspace = true
windows-sys = { workspace = true, features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
